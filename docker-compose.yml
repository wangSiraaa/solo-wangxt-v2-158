services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reg
      POSTGRES_PASSWORD: regpass
      POSTGRES_DB: regreview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reg"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      REG_DATABASE_URL: postgresql+psycopg2://reg:regpass@db:5432/regreview
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
